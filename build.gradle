plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	// This artifact's Gradle module metadata is malformed; use its Maven POM.
	exclusiveContent {
		forRepository {
			maven {
				name = 'FabricLogging'
				url = 'https://maven.fabricmc.net/'
				metadataSources {
					mavenPom()
					ignoreGradleMetadataRedirection()
				}
			}
		}
		filter { includeModule('net.fabricmc', 'fabric-log4j-util') }
	}

	// Mod Menu provides the entrypoint into the Mini Macros editor.
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mini-macros" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu hosts our config screen. Also pulled into the dev runtime so
	// `runClient` can reach the editor the same way players will.
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Dependency-free checks run against the actual client classes without launching Minecraft.
sourceSets {
	regressionTest {
		compileClasspath = sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath = output + sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

[
	macroDataRegression: 'com.minimacros.macro.MacroDataRegressionTest',
	runtimeRegression: 'com.minimacros.runtime.RuntimeRegressionTest',
	canvasRegression: 'com.minimacros.gui.CanvasRegressionTest',
	textInputRegression: 'com.minimacros.runtime.TextInputRegressionTest'
].each { taskName, testClass ->
	tasks.register(taskName, JavaExec) {
		dependsOn tasks.named('regressionTestClasses')
		classpath = sourceSets.regressionTest.runtimeClasspath
		mainClass = testClass
		workingDir = layout.buildDirectory.dir("regression-tests/${taskName}").get().asFile
		doFirst { workingDir.mkdirs() }
	}
}

tasks.named('check') {
	dependsOn tasks.named('macroDataRegression'), tasks.named('runtimeRegression'),
			tasks.named('canvasRegression'), tasks.named('textInputRegression')
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
